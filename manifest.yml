applications:
  - name: ((name))
    memory: ((memory))M
    disk_quota: ((disk))M
    instances: ((instances))
    buildpacks:
      - nodejs_buildpack
    health-check-type: http
    health-check-http-endpoint: /streaming-services/health
    health-check-interval: ((healthCheckInterval))
    health-check-invocation-timeout: ((healthCheckInvocationTimeout))
    env:
      OPTIMIZE_MEMORY: true
      EASEY_DB_SERVICE: ((dbSvc))
      EASEY_STREAMING_SERVICES_HOST: ((host))
      EASEY_STREAMING_SERVICES_PORT: ((port))
      EASEY_STREAMING_SERVICES_PATH: ((path))
      EASEY_STREAMING_SERVICES_TITLE: ((title))
      EASEY_STREAMING_SERVICES_DESCRIPTION: ((description))
      EASEY_STREAMING_SERVICES_ENV: ((environment))
      EASEY_STREAMING_SERVICES_ENABLE_API_KEY: true
      EASEY_STREAMING_SERVICES_ENABLE_SECRET_TOKEN: true
      EASEY_STREAMING_SERVICES_ENABLE_CORS: true
      EASEY_STREAMING_SERVICES_ENABLE_GLOBAL_VALIDATION_PIPE: true
      EASEY_STREAMING_SERVICES_ENABLE_REPLICA_DB_ACCESS: true
      EASEY_STREAMING_SERVICES_BATCH_SIZE: 50000
      EASEY_API_GATEWAY_HOST: ((apiHost))
      TZ: America/New_York
      EASEY_STREAMING_SERVICES_MAX_POOL_SIZE: ((maxPoolSize))
      EASEY_STREAMING_SERVICES_IDLE_TIMEOUT: ((idleTimeout))
      EASEY_STREAMING_SERVICES_CONNECTION_TIMEOUT: ((connectionTimeout))
      EASEY_DB_STATEMENT_TIMEOUT: ((statementTimeout))
      EASEY_DB_STREAM_STATEMENT_TIMEOUT: ((streamStatementTimeout))
      EASEY_DB_IDLE_TRANS_SESSION_TIMEOUT: ((idleInTransactionSessionTimeout))
      EASEY_DB_MAX_USES_BEFORE_CONN_RECREATE: ((maxUsesBeforeRecreatingConnection))
      EASEY_DB_SQL_LOGGING: ((sqlLogging))
      EASEY_DB_MAX_QUERY_EXECUTION_TIMEOUT: ((maxQueryExecutionTime))
      EASEY_DB_HEALTH_TIMEOUT: ((dbHealthTimeout))
    routes:
      - route: ((host))/((path))
    services:
      - camd-pg-db
      - log-drain
